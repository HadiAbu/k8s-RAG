[project]
name = "k8s-rag"
version = "1.0.0"
description = "Kubernetes Documentation RAG Assistant"
requires-python = ">=3.12"
readme = "README.md"

[project.scripts]
k8s-rag = "cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]